name: Release Rules

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'blacklist.txt'
      - 'whitelist.txt'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Create release notes
        run: |
          echo "## AdGuard Home Rules Update" > release_notes.md
          echo "" >> release_notes.md
          echo "**Release Date:** ${{ steps.date.outputs.date }}" >> release_notes.md
          echo "" >> release_notes.md
          echo "### Rules Statistics" >> release_notes.md
          echo "- **Blacklist Rules:** $(wc -l < blacklist.txt) entries" >> release_notes.md
          echo "- **Whitelist Rules:** $(wc -l < whitelist.txt) entries" >> release_notes.md
          echo "" >> release_notes.md
          echo "### Subscription URLs" >> release_notes.md
          echo "- **Blacklist:** `https://github.com/${{ github.repository }}/releases/latest/download/blacklist.txt`" >> release_notes.md
          echo "- **Whitelist:** `https://github.com/${{ github.repository }}/releases/latest/download/whitelist.txt`" >> release_notes.md
          echo "" >> release_notes.md
          echo "### How to Subscribe" >> release_notes.md
          echo "1. Open AdGuard Home settings" >> release_notes.md
          echo "2. Go to Filters > DNS blocklists (or DNS allowlists)" >> release_notes.md
          echo "3. Add the subscription URL above" >> release_notes.md

      - name: Create release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: latest
          release_name: Rules ${{ steps.date.outputs.date }}
          body_path: release_notes.md
          draft: false
          prerelease: false

      - name: Upload blacklist
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./blacklist.txt
          asset_name: blacklist.txt
          asset_content_type: text/plain

      - name: Upload whitelist
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./whitelist.txt
          asset_name: whitelist.txt
          asset_content_type: text/plain
