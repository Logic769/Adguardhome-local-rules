name: Release Rules

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'blacklist.txt'
      - 'whitelist.txt'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug information
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref }}"
          echo "Event: ${{ github.event_name }}"
          ls -la

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Count rules
        id: count
        run: |
          blacklist_count=$(wc -l < blacklist.txt)
          whitelist_count=$(wc -l < whitelist.txt)
          echo "blacklist=${blacklist_count}" >> $GITHUB_OUTPUT
          echo "whitelist=${whitelist_count}" >> $GITHUB_OUTPUT
          echo "Blacklist count: $blacklist_count"
          echo "Whitelist count: $whitelist_count"

      - name: Create release notes
        run: |
          cat > release_notes.md << 'EOF'
          ## AdGuard Home Rules Update

          **Release Date:** ${{ steps.date.outputs.date }}

          ### Rules Statistics
          - **Blacklist Rules:** ${{ steps.count.outputs.blacklist }} entries
          - **Whitelist Rules:** ${{ steps.count.outputs.whitelist }} entries

          ### Subscription URLs
          - **Blacklist:** `https://github.com/${{ github.repository }}/releases/latest/download/blacklist.txt`
          - **Whitelist:** `https://github.com/${{ github.repository }}/releases/latest/download/whitelist.txt`

          ### How to Subscribe
          1. Open AdGuard Home settings
          2. Go to Filters > DNS blocklists (or DNS allowlists)
          3. Add the subscription URL above
          EOF
          cat release_notes.md

      - name: Delete old tag
        run: |
          git tag -d latest || true
          git push origin :latest || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: Rules ${{ steps.date.outputs.date }}
          body_path: release_notes.md
          files: |
            blacklist.txt
            whitelist.txt
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
